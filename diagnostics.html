<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hatviz Diagnostics</title>
	<style>
		:root {
			color-scheme: light;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #f6f7f9;
			color: #1f2328;
		}
		body {
			margin: 0;
			padding: 24px;
		}
		main {
			max-width: 1180px;
			margin: 0 auto;
		}
		header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 16px;
			margin-bottom: 18px;
		}
		h1 {
			font-size: 24px;
			line-height: 1.2;
			margin: 0 0 4px;
		}
		h2 {
			font-size: 17px;
			line-height: 1.25;
			margin: 0;
		}
		p {
			margin: 0;
		}
		button {
			border: 1px solid #b8c0cc;
			border-radius: 6px;
			background: #fff;
			color: #1f2328;
			cursor: pointer;
			font: inherit;
			padding: 7px 10px;
			text-decoration: none;
		}
		button:hover:not(:disabled) {
			background: #eef2f6;
		}
		button:disabled {
			color: #8c96a3;
			cursor: default;
		}
		.status-line {
			color: #5d6673;
			font-size: 13px;
		}
		.toolbar {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
		}
		.card {
			background: #fff;
			border: 1px solid #d9dee7;
			border-radius: 8px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(31, 35, 40, 0.05);
		}
		#graphs {
			display: grid;
			gap: 16px;
		}
		.graph-card {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 300px;
			gap: 18px;
		}
		.series-toggles {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin: 10px 0 12px;
		}
		.series-toggle {
			align-items: center;
			border: 1px solid #d9dee7;
			border-radius: 6px;
			display: inline-flex;
			gap: 7px;
			padding: 5px 8px;
			user-select: none;
		}
		.series-toggle input {
			margin: 0;
		}
		.series-swatch {
			border-radius: 999px;
			display: inline-block;
			height: 10px;
			width: 10px;
		}
		canvas {
			display: block;
			width: 100%;
			height: 360px;
			border: 1px solid #d9dee7;
			border-radius: 6px;
			background: #fff;
		}
		.meta-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 8px;
			font-size: 13px;
		}
		.meta-row {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid #eef0f3;
			padding-bottom: 5px;
		}
		.meta-row span:first-child {
			color: #5d6673;
		}
		.empty {
			color: #5d6673;
			padding: 28px;
			text-align: center;
		}
		.error {
			color: #9a3412;
		}
		@media (max-width: 820px) {
			body {
				padding: 14px;
			}
			header, .graph-card {
				display: block;
			}
			.toolbar {
				margin-top: 12px;
			}
			canvas {
				height: 300px;
				margin-bottom: 14px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<div>
				<h1>Hatviz Diagnostics</h1>
				<p id="status" class="status-line">Waiting for diagnostics...</p>
			</div>
			<div class="toolbar">
				<button id="refresh" type="button">Refresh</button>
				<button id="save" type="button" disabled>Save JSON</button>
			</div>
		</header>
		<section id="graphs"></section>
	</main>
	<script src="diagnostics.js"></script>
</body>
</html>
